<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Pirata+One&display=swap" rel="stylesheet">
  <title>Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    
  background-image: url("./padre.png");
  background-repeat: no-repeat;   /* que no se repita */
  background-size: cover;        /* que cubra toda la pantalla */
  background-position: center;   /* centrado */
   min-height: 100vh;
}

    h2 {
      text-align: center;
      padding: 20px;
      color: red;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .galeria video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .galeria video:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
    <nav class="inknut-antiqua-regular">
  <h2>Videos</h2>
</nav>
  <div class="galeria">
    <video controls>
      <source src="xgrabacion_oKLeNeYt.mp4" type="video/mp4">
      Tu navegador no soporta el video.
    </video>
   
    
  </div>
</body>
</html>
